[project]
name = "geologparser"
version = "0.3.0"
description = "GeoLogParser: 離線地質鑽孔柱狀圖 OCR 與 Ollama (qwen3:8b) 繁體語意校對管線 (支援 RTX 5090 GPU 加速與斷點續傳)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.8.0",
    "rapidocr-onnxruntime>=1.4.0",
    "numpy>=1.24.0",
    "pillow>=10.0.0",
    "requests>=2.31.0",
    "opencc-python-reimplemented>=0.1.7",
]

[project.optional-dependencies]
gpu = [
    "onnxruntime-gpu>=1.18.0",
]
